- name: workout_add
  title: 追加动作
  description: 往当天已有的那场末尾追加动作；当天没排过会报 SESSION_NOT_FOUND。一般直接用 workout_plan。
  inputSchema:
    type: object
    properties:
      date:
        type: string
        minLength: 10
        maxLength: 10
        description: 日期 YYYY-MM-DD，不传表示今天
      exercises:
        type: array
        minItems: 1
        maxItems: 20
        description: 要追加的动作，按数组顺序排在现有动作后面
        items:
          type: object
          properties:
            exercise_key:
              type: string
              enum:
              - goblet_squat
              - bulgarian_split_squat
              - romanian_deadlift
              - hip_thrust
              - glute_bridge
              - walking_lunge
              - push_up
              - dumbbell_bench_press
              - bent_over_row
              - lat_pulldown
              - bent_over_fly
              - overhead_press
              - lateral_raise
              - bicep_curl
              - triceps_extension
              - plank
              - side_plank
              - dead_bug
              - slider_mountain_climber
              - ab_wheel_kneeling_rollout
              description: 动作标识，必须是动作资料里已有的
            name:
              type: string
              minLength: 1
              maxLength: 40
              description: 显示名，不传用动作资料里的名字
            sets:
              type: integer
              minimum: 1
              maximum: 20
              description: 组数，不传用默认值
            reps:
              type: integer
              minimum: 1
              maximum: 300
              description: 每组次数，按秒计的动作填秒数，不传用默认值
            load_text:
              type: string
              maxLength: 30
              description: 负重描述，如「5kg壶铃」，徒手传空字符串
          required:
          - exercise_key
          additionalProperties: false
    required:
    - exercises
    additionalProperties: false
  outputSchema:
    type: object
    additionalProperties: true
  handler:
    type: script
    path: scripts/add_exercise.py
  _meta:
    ui:
      visibility:
      - model
      - app
    runtime: workout
    aliases:
    - add_exercise
    hidden: true
