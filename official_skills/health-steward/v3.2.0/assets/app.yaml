- name: now_card
  title: 到点该不该发
  description: 判断这一轮提醒发不发。send 为 false 就不要调 show_widget，也不要说已经提醒过；为 true 就把 show_widget 原样交给宿主的 show_widget。s1 / s2 不要把卡上的 image 贴进正文、不要写 media_info、不要调 image_generation，禁止把 image 地址抄进正文、media_info 或 photoUrl。s3 / s4 回执带 report_path 时，同一轮调一次 present_files，files 里只放这个路径的原文，不要改文件名，不要再跑 report_daily 或 report_weekly。创建 Things 不发 Now 卡，scene=created 也是 send 为 false。
  inputSchema:
    type: object
    properties:
      scene:
        type: string
        enum:
        - s1
        - s2
        - s3
        - s4
        - created
        description: s1 三餐 / s2 训练 / s3 日报 / s4 周报。created 已停用，调用也 send 为 false，不要发卡
      thing_id:
        type: string
        description: 真实 thing id。给了就和 todo_id 一起写进卡；不给则两个都不写
      todo_id:
        type: string
        description: 不传时按场景用 todo-s1-meals / todo-s2-train / todo-s3-daily / todo-s4-weekly
      date:
        type: string
        minLength: 10
        maxLength: 10
        description: YYYY-MM-DD，不传即今天（上海时区）
      slot:
        type: string
        enum:
        - breakfast
        - lunch
        - dinner
        description: s1 用。不传则 10 点前早餐、15 点前午餐、否则晚餐。规则 instruction 里写了就传那个
      day_complete_confirmed:
        type: boolean
        description: s3 用。用户确认过全天记完才填 true
      week_start:
        type: string
        minLength: 10
        maxLength: 10
        description: s4 用。周一 YYYY-MM-DD
    required:
    - scene
    additionalProperties: false
  outputSchema:
    type: object
    additionalProperties: true
  handler:
    type: script
    path: scripts/now_card.py
  _meta:
    ui:
      visibility:
      - model
    runtime: workout
- name: now_setup
  title: 算出提醒参数
  description: 整套提醒时算出每条线的本地时刻和到点 prompt。一条提醒也要先跑，scenes 只放要的那几条。回执 after_enable.send 为 false，创建成功不要发 Now 卡，不要把 show_widget 交给宿主。本工具不创建 Thing。字段怎么写以刚加载的 make-things 为准，不要把回执原样拿去创建。没有这份回执不要 create_thing。
  inputSchema:
    type: object
    properties:
      scenes:
        type: array
        minItems: 1
        items:
          type: string
          enum:
          - s1
          - s2
          - s3
          - s4
        description: 要建哪几条。不传就是四条都建
      times:
        type: object
        properties:
          breakfast:
            type: string
            description: HH:MM，默认 08:30
          lunch:
            type: string
            description: HH:MM，默认 11:30
          dinner:
            type: string
            description: HH:MM，默认 17:30
          train:
            type: string
            description: HH:MM，默认 08:00
          daily:
            type: string
            description: HH:MM，默认 22:00
          weekly:
            type: string
            description: HH:MM，默认周日 22:00
        additionalProperties: false
        description: 只覆盖要改的时刻
      thing_id:
        type: string
        description: 已经有 Thing 时填上，回执带 existing_thing_id，创建时复用，不要新建
    additionalProperties: false
  outputSchema:
    type: object
    additionalProperties: true
  handler:
    type: script
    path: scripts/now_setup.py
  _meta:
    ui:
      visibility:
      - model
    runtime: workout
