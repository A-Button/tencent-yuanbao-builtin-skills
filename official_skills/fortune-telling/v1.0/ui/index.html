<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 算命馆</title>
<style>
  :root {
    --accent: #a78bfa;
    --accent-2: #f0abfc;
    --card-bg: rgba(255, 255, 255, 0.06);
    --card-border: rgba(255, 255, 255, 0.14);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #f5f3ff;
    background: radial-gradient(circle at 20% 15%, #3b2470 0%, transparent 45%),
                radial-gradient(circle at 85% 75%, #1e3a8a 0%, transparent 50%),
                linear-gradient(160deg, #0f0c29 0%, #24123f 45%, #1a1140 100%);
    background-attachment: fixed;
    padding: 32px 16px;
  }
  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(1.5px 1.5px at 10% 20%, #fff 100%, transparent 0),
      radial-gradient(1.5px 1.5px at 80% 10%, #fff 100%, transparent 0),
      radial-gradient(1px 1px at 60% 35%, #fff 100%, transparent 0),
      radial-gradient(1.5px 1.5px at 30% 70%, #fff 100%, transparent 0),
      radial-gradient(1px 1px at 90% 60%, #fff 100%, transparent 0),
      radial-gradient(1.5px 1.5px at 45% 90%, #fff 100%, transparent 0),
      radial-gradient(1px 1px at 70% 85%, #fff 100%, transparent 0);
    opacity: 0.6;
  }
  .card {
    position: relative;
    max-width: 420px;
    margin: 0 auto;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 28px 26px 30px;
    backdrop-filter: blur(10px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
  }
  .header { text-align: center; margin-bottom: 24px; }
  .header .emoji { font-size: 40px; line-height: 1; }
  .header h1 {
    margin: 8px 0 4px;
    font-size: 22px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .header p { margin: 0; font-size: 13px; color: #c4b8e8; }

  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 13px;
    color: #d8cef5;
    margin-bottom: 6px;
  }
  .field input[type="text"],
  .field input[type="date"] {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--card-border);
    background: rgba(255, 255, 255, 0.05);
    color: #fff;
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s ease;
  }
  .field input:focus { border-color: var(--accent); }
  .field input::placeholder { color: #8f83b8; }

  .gender-group { display: flex; gap: 8px; }
  .gender-btn {
    flex: 1;
    text-align: center;
    padding: 9px 0;
    border-radius: 10px;
    border: 1px solid var(--card-border);
    background: rgba(255, 255, 255, 0.05);
    color: #d8cef5;
    font-size: 13px;
    cursor: pointer;
    user-select: none;
    transition: all 0.15s ease;
  }
  .gender-btn.active {
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    color: #1a1140;
    border-color: transparent;
    font-weight: 600;
  }

  .actions { display: flex; gap: 10px; margin-top: 22px; }
  .btn {
    flex: 1;
    padding: 12px 0;
    border-radius: 12px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.15s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-primary {
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    color: #1a1140;
  }
  .btn-secondary {
    background: rgba(255, 255, 255, 0.08);
    color: #f5f3ff;
    border: 1px solid var(--card-border);
  }

  .hint { margin-top: 10px; font-size: 12px; color: #f0abfc; min-height: 16px; }

  .result {
    margin-top: 20px;
    padding: 16px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--card-border);
    display: none;
  }
  .result.show { display: block; }
  .result .zodiac-emoji { font-size: 32px; text-align: center; }
  .result .zodiac-name {
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    margin: 4px 0 2px;
    color: #fff;
  }
  .result .zodiac-range { text-align: center; font-size: 12px; color: #c4b8e8; }
  .result .fortune-text {
    font-size: 13px;
    line-height: 1.7;
    color: #eae6ff;
    white-space: pre-wrap;
  }
</style>
</head>
<body>
  <div class="stars"></div>
  <div class="card">
    <div class="header">
      <div class="emoji">🔮</div>
      <h1>AI 算命馆</h1>
      <p>填好信息，让 AI 为你看看今日运势 ✨</p>
    </div>

    <div class="field">
      <label for="name">姓名</label>
      <input id="name" type="text" placeholder="请输入姓名">
    </div>

    <div class="field">
      <label>性别</label>
      <div class="gender-group" id="genderGroup">
        <div class="gender-btn active" data-value="女">女</div>
        <div class="gender-btn" data-value="男">男</div>
        <div class="gender-btn" data-value="其他">其他</div>
      </div>
    </div>

    <div class="field">
      <label for="birthDate">出生日期</label>
      <input id="birthDate" type="date">
    </div>

    <div class="actions">
      <button class="btn btn-secondary" id="zodiacBtn">✨ 测测星座</button>
      <button class="btn btn-primary" id="fortuneBtn">🔮 立即算命</button>
    </div>
    <div class="hint" id="hint"></div>

    <div class="result" id="result">
      <div id="zodiacResult" style="display:none">
        <div class="zodiac-emoji" id="zodiacEmoji"></div>
        <div class="zodiac-name" id="zodiacName"></div>
        <div class="zodiac-range" id="zodiacRange"></div>
      </div>
      <div id="fortuneResult" style="display:none">
        <div class="fortune-text" id="fortuneText"></div>
      </div>
    </div>
  </div>

  <script>
    // 性别选择
    const genderGroup = document.getElementById('genderGroup');
    genderGroup.addEventListener('click', (e) => {
      const btn = e.target.closest('.gender-btn');
      if (!btn) return;
      genderGroup.querySelectorAll('.gender-btn').forEach((el) => el.classList.remove('active'));
      btn.classList.add('active');
    });

    function getGender() {
      const active = genderGroup.querySelector('.gender-btn.active');
      return active ? active.dataset.value : '';
    }

    function getForm() {
      return {
        name: document.getElementById('name').value.trim(),
        gender: getGender(),
        birthDate: document.getElementById('birthDate').value,
      };
    }

    function showHint(text) {
      document.getElementById('hint').textContent = text;
    }

    function validateForm(form) {
      if (!form.name) return '请输入姓名';
      if (!form.birthDate) return '请选择出生日期';
      return '';
    }

    function setLoading(loading) {
      document.getElementById('zodiacBtn').disabled = loading;
      document.getElementById('fortuneBtn').disabled = loading;
    }

    // ✨ 测测星座：纯本地计算，不涉及模型推理，走 app.callScript 短路
    // （agent_server 在会话沙箱里执行 scripts/calc_zodiac.py，见 SKILL.md）。
    async function calcZodiac() {
      const form = getForm();
      const err = validateForm(form);
      if (err) { showHint(err); return; }
      showHint('');
      setLoading(true);
      try {
        const res = await app.callScript('calc_zodiac', { birth_date: form.birthDate });
        const data = res.structuredContent || {};
        if (data.error) {
          showHint(data.error);
          return;
        }
        document.getElementById('zodiacEmoji').textContent = data.emoji || '⭐';
        document.getElementById('zodiacName').textContent = data.zodiac || '未知星座';
        document.getElementById('zodiacRange').textContent = data.date_range || '';
        document.getElementById('zodiacResult').style.display = 'block';
        document.getElementById('fortuneResult').style.display = 'none';
        document.getElementById('result').classList.add('show');
      } catch (e) {
        showHint('计算失败：' + (e && e.message ? e.message : e));
      } finally {
        setLoading(false);
      }
    }

    // 🔮 立即算命：需要 Agent 结合姓名/性别/生日做开放式推理和话术生成，
    // 走 app.sendMessage，正常进入 react_loop（不短路），由宿主把 TEXT +
    // GUI_ACTION(app.sendMessage) 一并发给 Agent（见 SKILL.md 触发方式）。
    async function requestFortune() {
      const form = getForm();
      const err = validateForm(form);
      if (err) { showHint(err); return; }
      showHint('');
      setLoading(true);
      const text = `请结合以下信息帮我算一算今日运势，用轻松吉利的语气给出一段算命话术：` +
        `姓名 ${form.name}，性别 ${form.gender}，出生日期 ${form.birthDate}。`;
      try {
        const res = await app.sendMessage(text, form);
        const content = res && res.content ? res.content : '已提交给 AI，请在对话中查看算命结果～';
        document.getElementById('fortuneText').textContent = content;
        document.getElementById('fortuneResult').style.display = 'block';
        document.getElementById('zodiacResult').style.display = 'none';
        document.getElementById('result').classList.add('show');
      } catch (e) {
        showHint('发送失败：' + (e && e.message ? e.message : e));
      } finally {
        setLoading(false);
      }
    }

    document.getElementById('zodiacBtn').addEventListener('click', calcZodiac);
    document.getElementById('fortuneBtn').addEventListener('click', requestFortune);
  </script>
</body>
</html>
