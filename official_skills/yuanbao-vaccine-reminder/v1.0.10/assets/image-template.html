<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__PAGE_TITLE__</title>
<style>
:root{--desk:#24231f;--paper:#f7f3e9;--ink:#25231f;--grid:#5a5750;--red:#a7473d;--blue:#465987;--gray:#736f67;--done:#28724b;--done-bg:#e8f3e9;--progress:#2e6680;--progress-bg:#e7f1f5}
*{box-sizing:border-box}body{margin:0;background:var(--desk);color:var(--ink);font-family:"Songti SC","STSong","SimSun",serif}.view-radio{position:fixed;left:-9999px;opacity:0}.toolbar{position:sticky;top:0;z-index:20;padding:11px max(14px,calc((100vw - 1810px)/2));background:#24231ff5;border-bottom:1px solid #555148}.tabs{display:inline-flex;border:1px solid #888176}.tabs label{border-right:1px solid #888176;color:#eee8db;padding:8px 18px;font:16px/1.2 inherit;cursor:pointer}.tabs label:last-child{border-right:0}#view-time:checked~.toolbar label[for=view-time],#view-vaccine:checked~.toolbar label[for=view-vaccine]{background:#eee8db;color:var(--ink)}.workspace{padding:20px 34px 36px}.paper{width:1810px;max-width:calc(100vw - 68px);margin:0 auto;padding:50px 44px 36px;background:var(--paper);box-shadow:0 2px 18px #0008}.time-view,.vaccine-view{display:none}.single-visible{display:block}#view-time:checked~.workspace .time-view,#view-vaccine:checked~.workspace .vaccine-view{display:block}.head{text-align:center;margin-bottom:20px}.head h1{margin:0;font:500 34px/1.2 inherit;letter-spacing:.04em}.head p{margin:7px 0 0;color:var(--red);font:600 14px/1.45 inherit}.vaccine-view .head p{color:#6b675f;font-weight:400}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;table-layout:fixed;border:1.5px solid var(--grid);font-size:15px;line-height:1.24}th,td{border:1px solid var(--grid);padding:5px 7px;vertical-align:middle}th{font-weight:500;text-align:center}.time-table{min-width:1570px}.time-table .age{width:130px;text-align:center}.time-table .exam{width:110px;text-align:center}.time-table .free{width:410px}.time-table .paid{width:410px;color:var(--blue)}.time-table .price{width:120px;text-align:center}.exam-tag{color:var(--red);font-weight:700}.item{display:inline;border:0;padding:0;margin:0 .65em 0 0;background:transparent;color:inherit;font:inherit;cursor:pointer}.item.paid{color:var(--blue);font-weight:600}.item.done{color:var(--done)!important;font-weight:700}.item.done::after{content:" ✓";font-family:Arial,sans-serif}.matrix{min-width:1680px}.matrix th,.matrix td{text-align:center;height:42px;padding:5px 4px}.matrix .disease,.matrix .name{text-align:left;width:170px}.matrix .route{width:88px}.matrix .volume{width:86px}.matrix .code{width:78px}.matrix .slot{width:68px}.source-mark{display:inline;border:0;background:transparent;color:var(--ink);font:600 14px/1.15 inherit;cursor:pointer}.source-mark.paid{color:var(--blue)}.source-mark.conflict{color:var(--red)}.source-mark.done{color:var(--done)!important}.source-mark.done .dose::after{content:" ✓";font-family:Arial,sans-serif}.note{display:block;margin-top:3px;color:var(--red);font:9px/1.2 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.national{display:inline;border-bottom:1px dotted #817c73;color:var(--gray);font-size:12px}.national-note{display:block;margin-top:3px;color:var(--gray);font:9px/1.2 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.foot{margin-top:12px;padding-top:10px;border-top:1px solid #8a867e;color:#5f5a52;font:13px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.foot strong{color:var(--red)}.foot a{color:#3f5686}.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;color:#625e56;font:13px/1.4 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.legend i{display:inline-block;width:10px;height:10px;margin-right:5px}.black{background:var(--ink)}.blue{background:var(--blue)}.gray{background:var(--gray)}.red{background:var(--red)}.green{background:var(--done)}body.capture{background:var(--paper)}body.capture .toolbar{display:none}body.capture .workspace{padding:0}body.capture .paper{width:1810px;max-width:none;margin:0;padding:50px 44px 36px;box-shadow:none}
@media(max-width:980px){.workspace{padding:10px}.paper{max-width:calc(100vw - 20px);padding:28px 14px 24px}.head h1{font-size:24px}.head p{font-size:12px}.time-table{min-width:1450px}.matrix{min-width:1580px}}
@media print{@page{size:A3 landscape;margin:8mm}body{background:#fff}.toolbar{display:none}.workspace{padding:0}.paper{width:100%;max-width:none;padding:8mm;box-shadow:none}.head h1{font-size:25px}table{min-width:0!important;font-size:10px}.legend{display:none}}
.matrix tbody tr.status-complete>td{background:var(--done-bg);color:var(--done);font-weight:650}
.matrix tbody tr.status-progress>td{background:var(--progress-bg);color:var(--progress);font-weight:600}
.matrix tbody tr.status-complete :is(.source-mark,.national,.note,.national-note),.matrix tbody tr.status-progress :is(.source-mark,.national,.note,.national-note){color:inherit!important;border-color:currentColor}
.legend i.complete-row,.legend i.progress-row,.legend i.pending-row{border:1px solid}
.complete-row{background:var(--done-bg);border-color:var(--done)!important}.progress-row{background:var(--progress-bg);border-color:var(--progress)!important}.pending-row{background:var(--paper);border-color:#8a867e!important}
</style>
</head>
<body data-static-rendered="true">
__VIEW_SELECTOR__
<main class="workspace">
 <section class="paper __TIME_SECTION_CLASS__"><div class="head"><h1>__TIME_TITLE__</h1><p>__TIME_SUBTITLE__</p></div><div class="scroll"><table class="time-table" id="timeTable">__TIME_TABLE__</table></div><div class="legend"><span><i class="black"></i>免费／国家程序</span><span><i class="blue"></i>自费自愿</span><span><i class="green"></i>绿色文字与 ✓：材料明确记载已接种</span></div><div class="foot source">__SOURCE_HTML__</div></section>
 <section class="paper __VACCINE_SECTION_CLASS__"><div class="head"><h1>__VACCINE_TITLE__</h1><p>__VACCINE_SUBTITLE__</p></div><div class="scroll"><table class="matrix" id="matrixTable">__MATRIX_TABLE__</table></div><div class="foot"><strong>时间说明：</strong>__NOTICE__</div><div class="legend">__VACCINE_LEGEND__</div><div class="foot source">__SOURCE_HTML__</div></section>
</main>
<script>
const data=__REPORT_DATA__,report=data.report||{};
const params=new URLSearchParams(location.search);if(params.get('capture')==='1')document.body.classList.add('capture');
const requested=document.querySelector(`#view-${params.get('view')}`);if(requested)requested.checked=true;
const storageKey=`vaccine-report:${report.id||'report'}`;
const seeded=[...document.querySelectorAll('[data-id].done')].map(mark=>mark.dataset.id);let done;try{done=new Set(JSON.parse(localStorage.getItem(storageKey)||JSON.stringify(seeded)))}catch(_error){done=new Set(seeded)}
function sync(){document.querySelectorAll('[data-id]').forEach(mark=>{const on=done.has(mark.dataset.id);mark.classList.toggle('done',on);mark.setAttribute('aria-pressed',String(on))})}
document.addEventListener('click',event=>{const mark=event.target.closest('[data-id]');if(!mark)return;const id=mark.dataset.id;done.has(id)?done.delete(id):done.add(id);try{localStorage.setItem(storageKey,JSON.stringify([...done]))}catch(_error){}sync()});sync();
</script>
</body></html>
