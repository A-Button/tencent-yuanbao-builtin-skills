<!doctype html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    :root { color-scheme:light; --ink:#18202a; --muted:#687180; --paper:#fffdf9; --accent:#e46f61; --accent2:#f4b27a; --wash:#fff0e7; --line:rgba(24,32,42,.11); }
    * { box-sizing:border-box; }
    html, body { margin:0; min-height:100%; }
    body { display:grid; place-items:center; padding:28px; background:#ece8e1; color:var(--ink); font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif; }
    .share-card { position:relative; display:flex; flex-direction:column; width:720px; min-height:960px; overflow:hidden; padding:58px 58px 44px; color:var(--ink); background:linear-gradient(150deg,var(--paper) 0 68%,var(--wash)); box-shadow:0 28px 80px rgba(20,25,35,.18); isolation:isolate; }
    .share-card::before { content:""; position:absolute; z-index:-1; width:430px; height:430px; right:-190px; top:-180px; border-radius:50%; background:radial-gradient(circle,var(--accent2),transparent 68%); opacity:.28; }
    .share-card::after { content:""; position:absolute; z-index:-1; width:280px; height:280px; left:-120px; bottom:-130px; border:1px solid color-mix(in srgb,var(--accent) 22%,transparent); border-radius:50%; box-shadow:0 0 0 34px color-mix(in srgb,var(--accent) 5%,transparent),0 0 0 72px color-mix(in srgb,var(--accent) 4%,transparent); }
    .source-western, .source-vedic { --accent:#7258d8; --accent2:#d39be8; --wash:#f0ecff; }
    .source-bazi, .source-ziwei { --accent:#b85946; --accent2:#d6a26d; --wash:#faefe4; }
    .source-tarot { --ink:#f7f2ff; --muted:#c7bdd9; --paper:#100e1d; --accent:#b690ff; --accent2:#e887bd; --wash:#211735; --line:rgba(255,255,255,.14); }
    .source-entertainment { --accent:#ee7b32; --accent2:#ffc477; --wash:#fff1dc; }
    header { margin-bottom:30px; }
    .eyebrow { min-height:24px; margin:0 0 12px; color:var(--accent); font-size:18px; font-weight:760; letter-spacing:.12em; }
    h1 { margin:0; max-width:590px; font-size:52px; line-height:1.12; letter-spacing:-.04em; }
    .subtitle { min-height:24px; margin:15px 0 0; color:var(--muted); font-size:20px; line-height:1.5; }
    .hero { display:flex; align-items:center; gap:28px; margin:30px 0 24px; padding:26px 30px; border:1px solid var(--line); border-radius:28px; background:color-mix(in srgb,var(--paper) 78%,transparent); }
    .hero-symbol { display:grid; place-items:center; flex:0 0 118px; height:118px; border-radius:30px; background:var(--wash); color:var(--accent); font-family:Georgia,serif; font-size:72px; line-height:1; }
    .hero h2 { margin:0; font-size:31px; line-height:1.25; }
    .hero p { margin:8px 0 0; color:var(--muted); font-size:18px; line-height:1.45; }
    .keywords { display:flex; flex-wrap:wrap; gap:10px; margin:-4px 0 24px; }
    .keywords span { padding:8px 14px; border:1px solid color-mix(in srgb,var(--accent) 42%,transparent); border-radius:999px; color:var(--accent); font-size:17px; font-weight:700; }
    .items { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin:24px 0; }
    .item { min-height:128px; padding:20px 20px 18px; border-radius:22px; background:color-mix(in srgb,var(--wash) 70%,var(--paper)); }
    .item-symbol { display:block; margin-bottom:8px; color:var(--accent); font-family:Georgia,serif; font-size:30px; line-height:1; }
    .item h3 { margin:0; font-size:21px; line-height:1.35; }
    .item p { margin:7px 0 0; color:var(--muted); font-size:16px; line-height:1.45; }
    .summary { margin:26px 0; font-family:"Songti SC","Noto Serif CJK SC",serif; font-size:25px; line-height:1.68; letter-spacing:.01em; }
    .sections { margin-top:24px; border-top:1px solid var(--line); }
    .sections article { padding:19px 0; border-bottom:1px solid var(--line); }
    .sections h3 { margin:0 0 7px; color:var(--accent); font-size:18px; }
    .sections p { margin:0; color:var(--muted); font-size:17px; line-height:1.65; }
    footer { display:flex; justify-content:space-between; gap:22px; margin-top:auto; padding-top:18px; border-top:1px solid var(--line); color:var(--muted); font-size:14px; line-height:1.5; }
    footer .boundary { max-width:470px; }
    footer .date { white-space:nowrap; font-variant-numeric:tabular-nums; }
    .template-insight .hero { min-height:225px; align-items:flex-end; background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 18%,var(--paper)),color-mix(in srgb,var(--paper) 85%,transparent)); }
    .template-insight .hero-symbol { flex-basis:150px; height:150px; font-size:86px; }
    .template-insight .summary { font-size:29px; }
    .template-guide .items { grid-template-columns:repeat(3,minmax(0,1fr)); }
    .template-guide .item { min-height:154px; padding-top:24px; }
    .template-guide .item-symbol { font-size:36px; }
    .template-guide .hero { display:none; }
    @media (max-width:800px) {
      body { padding:0; }
      .share-card { width:100vw; min-height:133.333vw; padding:clamp(24px,8vw,58px) clamp(20px,7vw,50px) clamp(20px,6vw,44px); box-shadow:none; }
      header { margin-bottom:clamp(20px,5vw,30px); }
      .eyebrow { min-height:20px; margin-bottom:8px; font-size:clamp(14px,3.8vw,18px); }
      h1 { font-size:clamp(34px,8.5vw,52px); }
      .subtitle { min-height:20px; margin-top:10px; font-size:clamp(16px,4.2vw,20px); }
      .hero { gap:clamp(16px,4vw,28px); margin:clamp(20px,6vw,30px) 0 20px; padding:clamp(18px,5vw,26px); border-radius:clamp(20px,6vw,28px); }
      .hero-symbol { flex-basis:clamp(88px,24vw,118px); height:clamp(88px,24vw,118px); border-radius:clamp(22px,7vw,30px); font-size:clamp(54px,16vw,72px); }
      .hero h2 { font-size:clamp(24px,6.5vw,31px); }
      .hero p { font-size:clamp(15px,4.2vw,18px); }
      .keywords { gap:8px; margin-bottom:20px; }
      .keywords span { padding:7px 12px; font-size:clamp(14px,4vw,17px); }
      .items { gap:12px; margin:20px 0; }
      .item { min-height:0; padding:18px; border-radius:18px; }
      .item h3 { font-size:clamp(18px,5vw,21px); }
      .item p { font-size:clamp(14px,4vw,16px); }
      .summary { margin:22px 0; font-size:clamp(20px,5.8vw,25px); }
      .sections { margin-top:20px; }
      .sections p { font-size:clamp(15px,4.2vw,17px); }
      .template-insight .hero { min-height:0; }
      .template-insight .hero-symbol { flex-basis:clamp(104px,29vw,150px); height:clamp(104px,29vw,150px); font-size:clamp(64px,19vw,86px); }
      .template-insight .summary { font-size:clamp(22px,6.4vw,29px); }
    }
    @media (max-width:520px) {
      .hero { align-items:flex-start; }
      .hero-symbol { flex:0 0 78px; height:78px; border-radius:20px; font-size:48px; }
      .items, .template-guide .items { grid-template-columns:minmax(0,1fr); }
      .template-guide .item { min-height:0; padding-top:18px; }
      .template-insight .hero { align-items:center; }
      .template-insight .hero-symbol { flex-basis:92px; height:92px; font-size:56px; }
      footer { flex-direction:column; gap:8px; }
      footer .boundary { max-width:none; }
      footer .date { white-space:normal; }
    }
    @media (max-width:380px) {
      .share-card { padding:24px 20px 20px; }
      .hero { gap:14px; padding:16px; }
      .hero-symbol { flex-basis:68px; height:68px; font-size:42px; }
      .template-insight .hero-symbol { flex-basis:82px; height:82px; font-size:50px; }
    }
    @media print { body { padding:0; background:#fff; } .share-card { box-shadow:none; } }
  </style>
</head>
<body>
  <main class="share-card template-{{TEMPLATE_ID}} source-{{SOURCE_KIND}}" data-product-kind="share_card" data-card-id="{{CARD_ID}}">
    <header>
      <p class="eyebrow">{{EYEBROW}}</p>
      <h1>{{TITLE}}</h1>
      <p class="subtitle">{{SUBTITLE}}</p>
    </header>
    {{HIGHLIGHT}}
    {{KEYWORDS}}
    {{ITEMS}}
    <p class="summary">{{SUMMARY}}</p>
    {{SECTIONS}}
    <footer><span class="boundary">{{BOUNDARY}}</span><span class="date">{{DATE}}</span></footer>
  </main>
</body>
</html>
