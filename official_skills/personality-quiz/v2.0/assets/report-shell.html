<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{DOCUMENT_TITLE}}</title>
  <style>
    :root { color-scheme: light; --page:#f5f1e8; --paper:#fffdf7; --ink:#20211f; --muted:#77736a; --line:#d8d0c1; --accent:#9b4038; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--page); color:var(--ink); font-family:ui-serif,"Songti SC","Noto Serif CJK SC",serif; }
    .report-shell { width:min(960px,calc(100% - 32px)); margin:clamp(20px,5vw,72px) auto; padding:clamp(28px,6vw,72px); background:var(--paper); border:1px solid var(--line); box-shadow:0 18px 60px rgba(45,38,27,.06); font-size:17px; line-height:1.9; }
    h1 { margin:0 0 44px; font-size:clamp(32px,5vw,48px); line-height:1.2; font-weight:700; letter-spacing:-.03em; }
    h2 { margin:46px 0 20px; padding-bottom:12px; border-bottom:1px solid var(--line); font-size:clamp(24px,3.4vw,31px); line-height:1.35; }
    h3 { margin:34px 0 12px; color:var(--accent); font-size:21px; line-height:1.45; }
    p { margin:0 0 18px; }
    strong { color:#171612; font-weight:750; text-decoration:underline; text-decoration-color:rgba(155,64,56,.26); text-decoration-thickness:.18em; text-underline-offset:.08em; }
    ul,ol { margin:8px 0 22px; padding-left:1.5em; }
    li { margin:6px 0; padding-left:.15em; }
    blockquote { margin:22px 0; padding-left:18px; border-left:3px solid var(--accent); color:var(--muted); }
    hr { margin:38px 0; border:0; border-top:1px solid var(--line); }
    a { color:inherit; text-decoration-color:var(--accent); text-underline-offset:3px; }
    code { padding:.12em .3em; background:#f1eee5; font:85% ui-monospace,SFMono-Regular,monospace; }
    .disclaimer { margin-top:42px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:12px; line-height:1.7; }
    @media (max-width:640px) { .report-shell { width:100%; margin:0; border-left:0; border-right:0; padding:28px 20px 44px; font-size:16px; } h1 { margin-bottom:34px; } h2 { margin-top:38px; } }
{{SYSTEM_THEME}}
  </style>
</head>
<body class="report-{{CHART_SYSTEM}}">
  <article class="report-shell">
{{REPORT_BODY}}
  </article>
</body>
</html>
