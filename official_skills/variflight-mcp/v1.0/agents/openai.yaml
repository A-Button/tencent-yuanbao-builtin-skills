interface:
  display_name: "VariFlight MCP"
  short_description: "Route flight, airport, fare, and price-monitoring requests through VariFlight MCP"
  default_prompt: "Use $variflight-mcp for current flight, airport, airline, fare-reference, or explicitly confirmed price-monitoring requests."

dependencies:
  tools:
    - type: "mcp"
      value: "variflight-mcp"
      description: "VariFlight MCP server for current flight and airport data"
      transport: "streamable_http"
      url: "https://c-gw.variflight.com/chat_message/mcp/api"

policy:
  allow_implicit_invocation: true
