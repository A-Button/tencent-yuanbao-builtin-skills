id: health-steward
name: 健康管家
version: v1.0
description: 运动训练、饮食记录、健康日报与周报。只有记一餐和测算出饮食 XCard，日报周报出 HTML 产物。
resources:
- uri: ai_apps.skills.diet_assistant_res
  name: 今日饮食记录
  description: 今日饮食卡：一餐的标题、时间、实拍和食物清单，展开进详情页。
  path: assets/ui/diet.card.json
  mimeType: application/a2ui+json
  dataMode: keep_latest
tools:
- name: diet_record
  title: 记一餐
  description: 落库一餐并出饮食卡。用户已经吃了、或只发了食物图没说「只算不记」时用。只需逐项估营养，合计与 4-4-9 核验由脚本算；同一餐再记一次是新建一条，不合并。
  inputSchema:
    type: object
    properties:
      items:
        type: array
        minItems: 1
        description: 本餐食物，一样一项。每项只填 name、portion 和 kcal / protein_g / fat_g / carb_g / sodium_mg。不要传
          emoji、story、标题或解读段落；标题按食物名由脚本补，卡面 emoji 出卡时由脚本补。合计与 4-4-9 核验由脚本算，不要传 totals。
        items:
          type: object
          properties:
            name:
              type: string
            portion:
              type: string
              maxLength: 3
              description: 份量词，最多 3 个字：「1个」「一份」「一碗」「半份」。拼进卡面那行「白米饭 × 一碗」；克重写进正文。
            kcal:
              type: number
              minimum: 0
            protein_g:
              type: number
              minimum: 0
            fat_g:
              type: number
              minimum: 0
            carb_g:
              type: number
              minimum: 0
            sodium_mg:
              type: number
              minimum: 0
          required:
          - name
          - portion
          - kcal
          - protein_g
          - fat_g
          - carb_g
          - sodium_mg
          additionalProperties: false
      photoUrl:
        type: string
        description: '用户上传照片的引用，**本轮有图就必填**。

          两种取值，看当前这条消息里给的是哪种，原样抄，不要转换： 沙箱路径（`/data/inputs/xxx.jpg`，来自 [user_image_path]）或 http(s) 地址（短链 / COS 长链，来自
          [user_image_url]）。两种都有时抄 URL。 路径会由宿主在出卡时换成长效地址，你不需要、也没办法自己换。

          只抄当前这条消息里的那一个，不要从历史消息里翻。 缺省为 null：档案里仍是 null，出卡时填兜底图、角标「无图」。

          '
      eatenAt:
        type: string
        description: 'ISO 8601 用餐时间。优先级：用户说的钟点 > 照片拍摄时间 > 上传时刻（缺省）。 有拍摄时间时填 capture time，并配 eatenAtSource=photo。

          '
      eatenAtSource:
        type: string
        enum:
        - photo
        - upload
        - user
        description: user=用户口述；photo=照片拍摄时间；upload=上传时刻（默认）。
      mealType:
        type: string
        enum:
        - breakfast
        - beverage
        - lunch
        - afternoon_tea
        - dinner
        - midnight
        description: '餐次槽位。优先级：用户明确说了哪一餐 > 按 eatenAt 时间窗派生 > 上传时刻派生。用户说「这是午餐」时必须显式传 lunch。

          '
      beverageOnly:
        type: boolean
        description: 本餐只有饮品时置 true，直接归 beverage 且不并入任何一餐。
    required:
    - items
    additionalProperties: false
  outputSchema:
    type: object
    additionalProperties: true
  handler:
    type: script
    path: scripts/record_meal.py
  _meta:
    ui:
      resourceUri: ai_apps.skills.diet_assistant_res
      visibility:
      - model
      - app
    runtime: diet
    aliases:
    - record_meal
- name: diet_estimate
  title: 测算一餐
  description: 只算营养、不落库，卡片照出。明确只问热量（菜谱、配料表、生食材、纯文字「多少卡」）时用。
  inputSchema:
    type: object
    properties:
      items:
        type: array
        minItems: 1
        description: 本餐食物，一样一项。每项只填 name、portion 和 kcal / protein_g / fat_g / carb_g / sodium_mg。不要传
          emoji、story、标题或解读段落；标题按食物名由脚本补，卡面 emoji 出卡时由脚本补。合计与 4-4-9 核验由脚本算，不要传 totals。
        items:
          type: object
          properties:
            name:
              type: string
            portion:
              type: string
              maxLength: 3
              description: 份量词，最多 3 个字：「1个」「一份」「一碗」「半份」。拼进卡面那行「白米饭 × 一碗」；克重写进正文。
            kcal:
              type: number
              minimum: 0
            protein_g:
              type: number
              minimum: 0
            fat_g:
              type: number
              minimum: 0
            carb_g:
              type: number
              minimum: 0
            sodium_mg:
              type: number
              minimum: 0
          required:
          - name
          - portion
          - kcal
          - protein_g
          - fat_g
          - carb_g
          - sodium_mg
          additionalProperties: false
      photoUrl:
        type: string
        description: '用户上传照片的引用，**本轮有图就必填**。

          两种取值，看当前这条消息里给的是哪种，原样抄，不要转换： 沙箱路径（`/data/inputs/xxx.jpg`，来自 [user_image_path]）或 http(s) 地址（短链 / COS 长链，来自
          [user_image_url]）。两种都有时抄 URL。 路径会由宿主在出卡时换成长效地址，你不需要、也没办法自己换。

          只抄当前这条消息里的那一个，不要从历史消息里翻。 缺省为 null：档案里仍是 null，出卡时填兜底图、角标「无图」。

          '
    required:
    - items
    additionalProperties: false
  outputSchema:
    type: object
    additionalProperties: true
  handler:
    type: script
    path: scripts/estimate_meal.py
  _meta:
    ui:
      resourceUri: ai_apps.skills.diet_assistant_res
      visibility:
      - model
      - app
    runtime: diet
    aliases:
    - estimate_meal
- name: diet_day
  title: 看某天吃了什么
  description: 看某一天吃了什么：每餐的时间、食物、热量与宏量，以及跳过的餐次。不传日期就是今天。有记录时出饮食卡，卡面是当天最近一餐；当天没有记录时不出卡，回执带 card_empty。用户要分析某天吃了什么、吃得怎么样，用这个工具，不要只调 nutrition_summary。
  inputSchema:
    type: object
    properties:
      date:
        type: string
        description: 日期，格式 YYYY-MM-DD，缺省为今天。
    additionalProperties: false
  outputSchema:
    type: object
    additionalProperties: true
  handler:
    type: script
    path: scripts/get_day.py
  _meta:
    ui:
      visibility:
      - model
      - app
      resourceUri: ai_apps.skills.diet_assistant_res
    runtime: diet
    aliases:
    - get_day
- name: diet_skip
  title: 跳过一餐
  description: 把早/午/晚某一餐标成跳过，不进热量合计。用户说「不吃了」时立刻调。不出卡。
  inputSchema:
    type: object
    properties:
      mealType:
        type: string
        enum:
        - breakfast
        - lunch
        - dinner
        description: 要跳过的正餐槽位。
      date:
        type: string
        description: 日期，格式 YYYY-MM-DD，缺省为今天。
    required:
    - mealType
    additionalProperties: false
  outputSchema:
    type: object
    additionalProperties: true
  handler:
    type: script
    path: scripts/skip_meal.py
  _meta:
    ui:
      visibility:
      - model
      - app
    runtime: diet
    aliases:
    - skip_meal
- name: diet_stats
  title: 饮食统计
  description: 近 1 天或 7 天的饮食统计：日均热量与宏量、规律性评分。
  inputSchema:
    type: object
    properties:
      period:
        type: string
        enum:
        - day
        - week
        description: 统计档位，缺省 week。
      date:
        type: string
        description: 日期，格式 YYYY-MM-DD，缺省为今天。
    additionalProperties: false
  outputSchema:
    type: object
    additionalProperties: true
  handler:
    type: script
    path: scripts/get_stats.py
  _meta:
    ui:
      visibility:
      - model
      - app
    runtime: diet
    aliases:
    - get_stats
- name: diet_update
  title: 改一餐
  description: 改已落库那条记错的地方；items 改了会重算合计。又吃了一样东西不是改，是再记一条。
  inputSchema:
    type: object
    properties:
      mealId:
        type: string
        minLength: 1
        description: 记录 id，须复用工具返回值里的 meal_id，不要自己编。
      patch:
        type: object
        minProperties: 1
        description: 字段级改动，只允许修改下列业务字段。
        properties:
          eaten_at:
            type: string
          eaten_at_source:
            type: string
            enum:
            - photo
            - upload
            - user
          meal_type:
            type: string
            enum:
            - breakfast
            - beverage
            - lunch
            - afternoon_tea
            - dinner
            - midnight
          title:
            type: string
            maxLength: 40
            description: 只在用户要改这条记录的标题时传。不传就保持原标题。
          items:
            type: array
            minItems: 1
            description: 纠正后的完整食物清单，一样一项，字段与 diet_record 的 items 相同。不要附带 emoji、story 或解读段落。
            items:
              type: object
              properties:
                name:
                  type: string
                portion:
                  type: string
                  maxLength: 3
                  description: 份量词，最多 3 个字：「1个」「一份」「一碗」「半份」。克重写进正文，不要塞进这里。
                kcal:
                  type: number
                  minimum: 0
                protein_g:
                  type: number
                  minimum: 0
                fat_g:
                  type: number
                  minimum: 0
                carb_g:
                  type: number
                  minimum: 0
                sodium_mg:
                  type: number
                  minimum: 0
              required:
              - name
              - portion
              - kcal
              - protein_g
              - fat_g
              - carb_g
              - sodium_mg
              additionalProperties: false
          photo_url:
            type:
            - string
            - 'null'
          is_favorited:
            type: boolean
        additionalProperties: false
    required:
    - mealId
    - patch
    additionalProperties: false
  outputSchema:
    type: object
    additionalProperties: true
  handler:
    type: script
    path: scripts/update_meal.py
  _meta:
    ui:
      visibility:
      - model
      - app
    runtime: diet
    aliases:
    - update_meal
- name: diet_delete
  title: 删一餐
  description: 软删一条记录。调之前必须跟用户确认是哪一条。
  inputSchema:
    type: object
    properties:
      mealId:
        type: string
        minLength: 1
        description: 记录 id，须复用工具返回值里的 meal_id，不要自己编。
    required:
    - mealId
    additionalProperties: false
  outputSchema:
    type: object
    additionalProperties: true
  handler:
    type: script
    path: scripts/delete_meal.py
  _meta:
    ui:
      visibility:
      - model
      - app
    runtime: diet
    aliases:
    - delete_meal
- name: diet_meal
  title: 查一餐
  description: 按 meal_id 取单条记录。diet_day 的每餐已带宏量和食物，一般用不到。
  inputSchema:
    type: object
    properties:
      mealId:
        type: string
        minLength: 1
        description: 记录 id，须复用工具返回值里的 meal_id，不要自己编。
    required:
    - mealId
    additionalProperties: false
  outputSchema:
    type: object
    additionalProperties: true
  handler:
    type: script
    path: scripts/get_meal.py
  _meta:
    ui:
      visibility:
      - model
      - app
    runtime: diet
    aliases:
    - get_meal
    hidden: true
- name: workout_today
  title: 今日训练
  description: 看当天的身体状态、训练排期与完成进度。不传日期就是今天。不出饮食卡。用户问训练时不要再调 diet_day、diet_record 或 diet_estimate。
  inputSchema:
    type: object
    properties:
      date:
        type: string
        minLength: 10
        maxLength: 10
        description: 日期 YYYY-MM-DD，不传表示今天
    additionalProperties: false
  outputSchema:
    type: object
    additionalProperties: true
  handler:
    type: script
    path: scripts/get_today.py
  _meta:
    ui:
      visibility:
      - model
      - app
    runtime: workout
    aliases:
    - get_today
- name: workout_readiness
  title: 记录身体状态
  description: 记录当天疲劳与酸痛，返回训练建议（normal / reduced / rest）。建议由脚本按固定规则算，不要自己判断，也不要在参数里传结论。一天一条，重复调用覆盖。
  inputSchema:
    type: object
    properties:
      date:
        type: string
        minLength: 10
        maxLength: 10
        description: 日期 YYYY-MM-DD，不传表示今天
      fatigue:
        type: integer
        minimum: 1
        maximum: 5
        description: 疲劳程度，1 最轻 5 最重
      soreness:
        type: array
        maxItems: 9
        description: 肌肉酸痛清单，没有酸痛就不传或传空数组
        items:
          type: object
          properties:
            part:
              type: string
              enum:
              - neck
              - shoulder
              - chest
              - back
              - waist
              - hip
              - thigh_front
              - thigh_back
              - calf
              description: 部位：颈部/肩部/胸部/背部/腰部/臀部/大腿前侧/大腿后侧/小腿
            level:
              type: string
              enum:
              - mild
              - moderate
              - severe
              description: 程度：轻微/中度/严重，不传按轻微记
          required:
          - part
          additionalProperties: false
    required:
    - fatigue
    additionalProperties: false
  outputSchema:
    type: object
    additionalProperties: true
  handler:
    type: script
    path: scripts/log_readiness.py
  _meta:
    ui:
      visibility:
      - model
      - app
    runtime: workout
    aliases:
    - log_readiness
- name: workout_plan
  title: 排训练
  description: 给某天排训练。当天还没排过就新建一场（要 plan_name / cycle_index / cycle_size）；已经排过就把这次的动作接在末尾，已完成的不动，加练也用它。
  inputSchema:
    type: object
    properties:
      date:
        type: string
        minLength: 10
        maxLength: 10
        description: 日期 YYYY-MM-DD，不传表示今天
      plan_name:
        type: string
        minLength: 1
        maxLength: 40
        description: 计划名，如「臀腿与核心」。新建一场时必填，当天已有排期时忽略
      cycle_index:
        type: integer
        minimum: 1
        maximum: 99
        description: 这是本周期第几次，对应「第 2/3 次」里的 2。新建一场时必填，当天已有排期时忽略
      cycle_size:
        type: integer
        minimum: 1
        maximum: 99
        description: 本周期共几次，对应「第 2/3 次」里的 3。新建一场时必填，当天已有排期时忽略
      exercises:
        type: array
        minItems: 1
        maxItems: 20
        description: 动作清单，按数组顺序上屏；当天已有排期时接在末尾
        items:
          type: object
          properties:
            exercise_key:
              type: string
              enum:
              - goblet_squat
              - bulgarian_split_squat
              - romanian_deadlift
              - hip_thrust
              - glute_bridge
              - walking_lunge
              - push_up
              - dumbbell_bench_press
              - bent_over_row
              - lat_pulldown
              - bent_over_fly
              - overhead_press
              - lateral_raise
              - bicep_curl
              - triceps_extension
              - plank
              - side_plank
              - dead_bug
              - slider_mountain_climber
              - ab_wheel_kneeling_rollout
              description: 动作标识，必须是动作资料里已有的
            name:
              type: string
              minLength: 1
              maxLength: 40
              description: 显示名，不传用动作资料里的名字
            sets:
              type: integer
              minimum: 1
              maximum: 20
              description: 组数，不传用默认值
            reps:
              type: integer
              minimum: 1
              maximum: 300
              description: 每组次数，按秒计的动作填秒数，不传用默认值
            load_text:
              type: string
              maxLength: 30
              description: 负重描述，如「5kg壶铃」，徒手传空字符串
          required:
          - exercise_key
          additionalProperties: false
    required:
    - exercises
    additionalProperties: false
  outputSchema:
    type: object
    additionalProperties: true
  handler:
    type: script
    path: scripts/plan_session.py
  _meta:
    ui:
      visibility:
      - model
      - app
    runtime: workout
    aliases:
    - plan_session
- name: workout_done
  title: 勾完成
  description: 把动作标成已完成，一次可以多个。用 names（动作名）或 positions（第几个，从 1 数，按当天排期顺序）指；不给 session_id 就是今天那一场。全部勾完自动收场。
  inputSchema:
    type: object
    properties:
      names:
        type: array
        minItems: 1
        items:
          type: string
          minLength: 1
        description: 动作名，如 ["臀桥","硬拉"]；「第2个动作」这种说法也认
      positions:
        type: array
        minItems: 1
        items:
          type: integer
          minimum: 1
          maximum: 20
        description: 第几个动作，从 1 数，按当天排期顺序
      date:
        type: string
        minLength: 10
        maxLength: 10
        description: 日期 YYYY-MM-DD，不传表示今天
      session_id:
        type: string
        minLength: 1
        description: 老调用用的训练 id；不传就是 date 那天（缺省今天）的那一场
      exercise_id:
        type: string
        minLength: 1
        description: 老调用用的动作 id；新调用用 names / positions
    additionalProperties: false
  outputSchema:
    type: object
    additionalProperties: true
  handler:
    type: script
    path: scripts/complete_exercise.py
  _meta:
    ui:
      visibility:
      - model
      - app
    runtime: workout
    aliases:
    - complete_exercise
    legacy_params:
    - session_id
    - exercise_id
- name: workout_adjust
  title: 改组次
  description: 改某个动作的组数、次数或负重。动作用 name 或 position（第几个）指，不给 session_id 就是今天那一场。
  inputSchema:
    type: object
    properties:
      name:
        type: string
        minLength: 1
        description: 动作名
      position:
        type: integer
        minimum: 1
        maximum: 20
        description: 第几个动作，从 1 数
      sets:
        type: integer
        minimum: 1
        maximum: 20
        description: 新组数，不改就别传
      reps:
        type: integer
        minimum: 1
        maximum: 300
        description: 新次数，不改就别传
      load_text:
        type: string
        maxLength: 30
        description: 新负重描述，传空字符串表示徒手
      date:
        type: string
        minLength: 10
        maxLength: 10
        description: 日期 YYYY-MM-DD，不传表示今天
      session_id:
        type: string
        minLength: 1
        description: 老调用用的训练 id；不传就是 date 那天（缺省今天）的那一场
      exercise_id:
        type: string
        minLength: 1
        description: 老调用用的动作 id；新调用用 names / positions
    additionalProperties: false
  outputSchema:
    type: object
    additionalProperties: true
  handler:
    type: script
    path: scripts/update_exercise_setting.py
  _meta:
    ui:
      visibility:
      - model
      - app
    runtime: workout
    aliases:
    - update_exercise_setting
    legacy_params:
    - session_id
    - exercise_id
- name: workout_detail
  title: 动作要领
  description: 动作要领：主要肌群、呼吸、难度、常见错误，以及它在今天这场里的设置。用 position（今天第几个）、name 或 exercise_key 指。
  inputSchema:
    type: object
    properties:
      position:
        type: integer
        minimum: 1
        maximum: 20
        description: 今天第几个动作，从 1 数。用户说「第1个动作」就填 1
      name:
        type: string
        minLength: 1
        description: 动作名，先在今天的清单里找，找不到再查动作资料
      exercise_key:
        type: string
        enum:
        - goblet_squat
        - bulgarian_split_squat
        - romanian_deadlift
        - hip_thrust
        - glute_bridge
        - walking_lunge
        - push_up
        - dumbbell_bench_press
        - bent_over_row
        - lat_pulldown
        - bent_over_fly
        - overhead_press
        - lateral_raise
        - bicep_curl
        - triceps_extension
        - plank
        - side_plank
        - dead_bug
        - slider_mountain_climber
        - ab_wheel_kneeling_rollout
        description: 动作标识
    additionalProperties: false
  outputSchema:
    type: object
